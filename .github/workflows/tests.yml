# xrnloops: the checks that need no emulator, on every push (XRNLOOPS.md). Loop's own CI ran the
# instrumented tests on a self-hosted machine and upstream has switched it off; ours run locally
# (docs/TEST.md). GitHub-hosted runners cost this private repo minutes, so this stays small.
name: Tests

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests, lint, and the instrumented tests still compile
        run: >
          ./gradlew --console=plain
          :uhabits-core:jvmTest
          :uhabits-android:testDebugUnitTest
          :uhabits-android:ktlintCheck
          :uhabits-android:compileDebugAndroidTestKotlin

      # The sync server on the oldest and newest Python it may run on: how deep json.loads nests
      # changed in 3.14, which the home server runs. Each runs even when the other fails.
      - uses: actions/setup-python@v7
        id: py312
        if: ${{ !cancelled() }}
        with:
          python-version: '3.12'

      - uses: actions/setup-python@v7
        id: py314
        if: ${{ !cancelled() }}
        with:
          python-version: '3.14'

      - name: Sync server tests, Python 3.12
        if: ${{ !cancelled() }}
        run: |
          py="${{ steps.py312.outputs.python-path }}"
          "$py" -m pip install --quiet bcrypt
          "$py" -m unittest server/test_xrnloops_sync.py

      - name: Sync server tests, Python 3.14
        if: ${{ !cancelled() }}
        run: |
          py="${{ steps.py314.outputs.python-path }}"
          "$py" -m pip install --quiet bcrypt
          "$py" -m unittest server/test_xrnloops_sync.py

      - name: Keep the reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            uhabits-core/build/reports/
            uhabits-android/build/reports/
